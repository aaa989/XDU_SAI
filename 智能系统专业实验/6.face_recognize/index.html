<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能表情识别平台</title>
  <style>
    :root {
      --primary:       #1A365D;
      --primary-hover: #22427a;
      --cta:           #2196F3;
      --cta-hover:     #1976D2;
      --cta-light:     #E3F2FD;
      --neutral:       #B0BEC5;
      --bg:            #F0F4F7;
      --surface:       #FFFFFF;
      --border:        #E2E8EF;
      --text:          #1A365D;
      --text-sub:      #607D8B;
      --text-muted:    #B0BEC5;
      --success:       #2E7D32;
      --success-bg:    #F1F8F1;
      --danger:        #C62828;
      --danger-bg:     #FFF5F5;
      --warning:       #F57C00;
      --r-card:        16px;
      --r-btn:         10px;
      --shadow-card:   0 2px 16px rgba(26,54,93,.07);
      --shadow-md:     0 4px 24px rgba(26,54,93,.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }
    .icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }

    /* Navbar */
    .navbar { background: var(--surface); border-bottom: 1px solid var(--border); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow-card); }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 34px; height: 34px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }
    .logo-name { font-size: 17px; font-weight: 700; color: var(--primary); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 20px; border: none; border-radius: var(--r-btn); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .18s; white-space: nowrap; outline: none; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--cta); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--cta-hover); box-shadow: 0 4px 12px rgba(33,150,243,.3); transform: translateY(-1px); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-bg); }
    .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--primary); background: var(--bg); }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px 48px; }
    .hero { text-align: center; padding: 40px 0 30px; }
    .hero h1 { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .hero h1 .accent { color: var(--cta); }
    .hero p { font-size: 15px; color: var(--text-sub); }

    /* Tabs */
    .tabs-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 6px; display: flex; gap: 4px; margin-bottom: 24px; max-width: 600px; margin-left: auto; margin-right: auto; }
    .tab-btn { flex: 1; padding: 11px 16px; border: none; background: transparent; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-sub); transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(26,54,93,.2); }

    /* Panels & Cards */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 20px; }
    .card-body { padding: 20px; text-align: center; }

    /* Two-Column Layout */
    .two-col-layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; text-align: left; }
    @media (max-width: 800px) { .two-col-layout { grid-template-columns: 1fr; } }
    .display-container { display: flex; flex-direction: column; gap: 16px; }
    
    /* Sidebar */
    .sidebar { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; height: 480px; }
    .sidebar-title { font-size: 14px; font-weight: bold; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .sidebar-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
    
    /* Emotion Log Item */
    .log-item { background: #fff; padding: 12px; border-radius: 8px; border-left: 4px solid var(--cta); font-size: 13px; box-shadow: 0 2px 8px rgba(26,54,93,.04); display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    .log-item .emoji { font-size: 20px; margin-right: 8px; }
    .log-item .emotion-name { font-weight: bold; color: var(--text); font-size: 14px; display: flex; align-items: center; }
    .log-item .time { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    
    /* Color coding for specific emotions */
    .log-item[data-emotion="Happiness"] { border-left-color: var(--success); }
    .log-item[data-emotion="Anger"], .log-item[data-emotion="Disgust"] { border-left-color: var(--danger); }
    .log-item[data-emotion="Surprise"], .log-item[data-emotion="Fear"] { border-left-color: var(--warning); }

    /* Display Area */
    .display-area { width: 100%; height: 480px; background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; overflow: hidden; position: relative; }
    .display-area img { width: 100%; height: 100%; object-fit: contain; display: none; }

    /* Toast */
    .toast { position: fixed; top: 74px; right: 24px; background: var(--primary); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-md); z-index: 999; transform: translateX(130%); transition: transform .3s; display: flex; align-items: center; gap: 8px; }
    .toast.show { transform: translateX(0); }
  </style>
</head>
<body>

<!-- SVG 线条图标库 -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ic-face" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="7" y="7" width="10" height="10" rx="2" ry="2"></rect></symbol>
  <symbol id="ic-camera" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></symbol>
  <symbol id="ic-image" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol>
  <symbol id="ic-list" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></symbol>
</svg>

<nav class="navbar">
  <div class="logo">
    <div class="logo-icon"><svg class="icon" width="20" height="20" stroke="currentColor"><use href="#ic-face"/></svg></div>
    <div class="logo-name">智能表情识别平台</div>
  </div>
  <div class="nav-right">
    <span style="font-size: 12px; color: var(--text-sub);">Powered by PyTorch & ResNet18</span>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1>基于BN剪枝的<span class="accent">面部表情识别系统</span></h1>
    <p>实时分析 7 种基本情绪特征，支持高精度网络轻量化剪枝模型</p>
  </div>

  <div class="tabs-wrap">
    <button class="tab-btn active" onclick="switchTab('dynamic', this)">
      <svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-camera"/></svg>动态表情捕捉 (摄像头)
    </button>
    <button class="tab-btn" onclick="switchTab('static', this)">
      <svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-image"/></svg>静态表情分析 (图片)
    </button>
  </div>

  <!-- 1. 动态识别面板 -->
  <div id="panel-dynamic" class="panel active">
    <div class="card">
      <div class="card-body">
        <div class="two-col-layout">
          <div class="display-container">
            <div class="display-area" id="videoArea">
              <span id="videoPlaceholder" style="color:var(--text-muted);">点击下方按钮开启摄像头</span>
              <img id="videoFeed" src="" alt="Video Feed">
            </div>
            <div style="display: flex; gap: 10px; justify-content: center;">
              <button class="btn btn-primary" id="startCamBtn" onclick="toggleAnalysisCamera(true)">开启摄像头检测</button>
              <button class="btn btn-ghost" id="stopCamBtn" onclick="toggleAnalysisCamera(false)" disabled>关闭摄像头</button>
            </div>
          </div>
          <div class="sidebar">
            <div class="sidebar-title"><svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-list"/></svg>实时表情记录</div>
            <div class="sidebar-list" id="dynamicLogList">
              <div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">等待摄像头开启...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 静态识别面板 -->
  <div id="panel-static" class="panel">
    <div class="card">
      <div class="card-body">
        <div class="two-col-layout">
          <div class="display-container">
            <div class="display-area" id="staticArea" style="background: var(--bg); border: 2px dashed var(--border);">
              <span id="staticPlaceholder" style="color: var(--text-muted);">在此预览图片</span>
              <img id="staticResult" src="" alt="Result">
            </div>
            <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
              <input type="file" id="staticImageInput" accept="image/*" style="display: none;" onchange="previewStaticImage(event)">
              <button class="btn btn-ghost" onclick="document.getElementById('staticImageInput').click()">选择包含人脸的图片</button>
              <button class="btn btn-primary" id="recognizeBtn" onclick="recognizeStatic()">开始分析表情</button>
              <button class="btn btn-danger" id="clearStaticBtn" onclick="clearStatic()" style="display:none;"><svg class="icon" width="14" height="14" stroke="currentColor"><use href="#ic-trash"/></svg> 清除</button>
            </div>
          </div>
          <div class="sidebar">
            <div class="sidebar-title"><svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-face"/></svg>表情分析结果</div>
            <div class="sidebar-list" id="staticResultList">
              <div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">请上传图片并点击开始分析</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"><span id="toastMsg">操作成功</span></div>

<script>
  // ================= 表情字典映射 =================
  const emotionDict = {
    'Anger':     { emoji: '😡', zh: '愤怒' },
    'Disgust':   { emoji: '🤢', zh: '厌恶' },
    'Fear':      { emoji: '😨', zh: '恐惧' },
    'Happiness': { emoji: '😄', zh: '高兴' },
    'Neutral':   { emoji: '😐', zh: '平静' },
    'Sadness':   { emoji: '😢', zh: '悲伤' },
    'Surprise':  { emoji: '😲', zh: '惊讶' }
  };

  // ================= 基础交互 =================
  let logPollingInterval = null;

  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');

    // 离开动态识别页面时关闭摄像头
    if (name !== 'dynamic') toggleAnalysisCamera(false);
  }

  function showToast(msg, isError=false) {
    const toast = document.getElementById('toast');
    toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
    document.getElementById('toastMsg').innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ================= 动态表情捕捉 =================
  function toggleAnalysisCamera(turnOn) {
    const img = document.getElementById('videoFeed');
    const placeholder = document.getElementById('videoPlaceholder');
    const startBtn = document.getElementById('startCamBtn');
    const stopBtn = document.getElementById('stopCamBtn');
    const logList = document.getElementById('dynamicLogList');

    if (turnOn) {
      // 向后端发起开启摄像头的请求
      fetch('/api/camera/start', { method: 'POST' }).then(() => {
        // 请求视频流地址
        img.src = "/video_feed?" + new Date().getTime();
        img.style.display = 'block'; placeholder.style.display = 'none';
        startBtn.disabled = true; stopBtn.disabled = false;
        showToast("检测摄像头已开启");
        logList.innerHTML = '';
        // 每 1.5 秒获取一次检测到的表情记录
        logPollingInterval = setInterval(fetchCameraLogs, 1500);
      });
    } else {
      if(logPollingInterval) { clearInterval(logPollingInterval); logPollingInterval = null; }
      fetch('/api/camera/stop', { method: 'POST' }).then(() => {
        img.src = ""; img.style.display = 'none'; placeholder.style.display = 'block';
        startBtn.disabled = false; stopBtn.disabled = true;
        logList.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">等待摄像头开启...</div>';
      });
    }
  }

  async function fetchCameraLogs() {
    try {
      const res = await fetch('/api/camera/logs'); 
      const data = await res.json();
      const list = document.getElementById('dynamicLogList');
      if (!data.logs || data.logs.length === 0) return; // 没检测到人不刷新
      
      list.innerHTML = '';
      // 渲染表情记录
      data.logs.forEach(log => {
        const emotionInfo = emotionDict[log.emotion] || { emoji: '', zh: log.emotion };
        list.innerHTML += `
          <div class="log-item" data-emotion="${log.emotion}">
            <span class="emotion-name">${emotionInfo.emoji ? `<span class="emoji">${emotionInfo.emoji}</span> ` : ''}${emotionInfo.zh} (${log.emotion})</span>
            <span class="time">${log.time}</span>
          </div>`;
      });
    } catch (e) {}
  }

  // ================= 静态图片分析 =================
  let staticFile = null;
  function previewStaticImage(e) {
    staticFile = e.target.files[0];
    if (staticFile) {
      document.getElementById('staticResult').src = URL.createObjectURL(staticFile);
      document.getElementById('staticResult').style.display = 'block';
      document.getElementById('staticPlaceholder').style.display = 'none';
      document.getElementById('clearStaticBtn').style.display = 'inline-flex';
      document.getElementById('staticResultList').innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">图片已就绪，请点击开始分析表情</div>';
    }
  }

  async function recognizeStatic() {
    if (!staticFile) return showToast("请先选择一张图片！", true);
    const btn = document.getElementById('recognizeBtn'); 
    btn.innerText = "分析中..."; btn.disabled = true;
    const formData = new FormData(); 
    formData.append("file", staticFile);

    try {
      const res = await fetch('/api/recognize_static', { method: 'POST', body: formData });
      const data = await res.json();
      
      if (data.success) {
        // 更新带有画框的图片
        document.getElementById('staticResult').src = "data:image/jpeg;base64," + data.image;
        const list = document.getElementById('staticResultList');
        
        if(!data.emotions || data.emotions.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">未在画面中检测到人脸</div>';
        } else {
          list.innerHTML = '';
          data.emotions.forEach(emotionStr => {
             const emotionInfo = emotionDict[emotionStr] || { emoji: '', zh: emotionStr };
             list.innerHTML += `
               <div class="log-item" data-emotion="${emotionStr}">
                 <span class="emotion-name">${emotionInfo.emoji ? `<span class="emoji">${emotionInfo.emoji}</span> ` : ''}${emotionInfo.zh} (${emotionStr})</span>
               </div>`;
          });
        }
        showToast("分析完成！");
      } else {
        showToast(data.error, true);
      }
    } catch (err) { 
      showToast("请求失败，请检查后端服务", true); 
    } finally { 
      btn.innerText = "开始分析表情"; btn.disabled = false; 
    }
  }

  function clearStatic() {
    staticFile = null; document.getElementById('staticImageInput').value = '';
    document.getElementById('staticResult').src = ''; document.getElementById('staticResult').style.display = 'none';
    document.getElementById('staticPlaceholder').style.display = 'block'; document.getElementById('clearStaticBtn').style.display = 'none';
    document.getElementById('staticResultList').innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">请上传图片并点击开始分析</div>';
    showToast("图片及结果已清除");
  }
</script>
</body>
</html>
