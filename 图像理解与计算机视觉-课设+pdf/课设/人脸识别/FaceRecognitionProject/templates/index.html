<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能人脸识别平台</title>
  <style>
    :root {
      --primary:       #1A365D;
      --primary-hover: #22427a;
      --cta:           #2196F3;
      --cta-hover:     #1976D2;
      --cta-light:     #E3F2FD;
      --neutral:       #B0BEC5;
      --bg:            #F0F4F7;
      --surface:       #FFFFFF;
      --border:        #E2E8EF;
      --text:          #1A365D;
      --text-sub:      #607D8B;
      --text-muted:    #B0BEC5;
      --success:       #2E7D32;
      --success-bg:    #F1F8F1;
      --danger:        #C62828;
      --danger-bg:     #FFF5F5;
      --r-card:        16px;
      --r-btn:         10px;
      --shadow-card:   0 2px 16px rgba(26,54,93,.07);
      --shadow-md:     0 4px 24px rgba(26,54,93,.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }
    .icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }

    /* Navbar */
    .navbar { background: var(--surface); border-bottom: 1px solid var(--border); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow-card); }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 34px; height: 34px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }
    .logo-name { font-size: 17px; font-weight: 700; color: var(--primary); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 20px; border: none; border-radius: var(--r-btn); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .18s; white-space: nowrap; outline: none; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--cta); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--cta-hover); box-shadow: 0 4px 12px rgba(33,150,243,.3); transform: translateY(-1px); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-bg); }
    .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--primary); background: var(--bg); }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px 48px; }
    .hero { text-align: center; padding: 40px 0 30px; }
    .hero h1 { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .hero h1 .accent { color: var(--cta); }
    .hero p { font-size: 15px; color: var(--text-sub); }

    /* Tabs */
    .tabs-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 6px; display: flex; gap: 4px; margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 11px 16px; border: none; background: transparent; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-sub); transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(26,54,93,.2); }

    /* Panels & Cards */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 20px; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; color: var(--primary); }
    .card-body { padding: 20px; text-align: center; }

    /* Two-Column Layout */
    .two-col-layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; text-align: left; }
    @media (max-width: 800px) { .two-col-layout { grid-template-columns: 1fr; } }
    .display-container { display: flex; flex-direction: column; gap: 16px; }
    
    /* Sidebar */
    .sidebar { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; height: 480px; }
    .sidebar-title { font-size: 14px; font-weight: bold; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .sidebar-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .log-item { background: #fff; padding: 12px; border-radius: 8px; border-left: 4px solid var(--success); font-size: 13px; box-shadow: 0 2px 8px rgba(26,54,93,.04); display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    .log-item.unknown { border-left-color: var(--danger); }
    .log-item .time { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    .log-item .name { font-weight: bold; color: var(--text); }

    /* Display Area */
    .display-area { width: 100%; height: 480px; background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; overflow: hidden; position: relative; }
    .display-area img { width: 100%; height: 100%; object-fit: contain; display: none; }

    /* Table */
    .table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: var(--bg); padding: 12px 16px; color: var(--text-sub); font-size: 13px; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text); font-weight: 500; }
    tr:last-child td { border-bottom: none; }

    /* Form & Modal */
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    .form-input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--r-input); padding: 10px 14px; font-size: 14px; outline: none; transition: border-color .18s; }
    .form-input:focus { border-color: var(--cta); }
    .modal-mask { display: none; position: fixed; inset: 0; background: rgba(26,54,93,.35); backdrop-filter: blur(2px); z-index: 500; align-items: center; justify-content: center; }
    .modal-mask.open { display: flex; }
    .modal-box { background: var(--surface); border-radius: var(--r-card); padding: 28px; width: 450px; box-shadow: var(--shadow-md); max-height: 90vh; overflow-y: auto;}
    .toast { position: fixed; top: 74px; right: 24px; background: var(--primary); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-md); z-index: 999; transform: translateX(130%); transition: transform .3s; display: flex; align-items: center; gap: 8px; }
    .toast.show { transform: translateX(0); }

    /* Camera Crop Specific */
    #camVideo { width: 100%; border-radius: 8px; background: #000; transform: scaleX(-1); } /* 镜像 */
    #camCanvas { width: 100%; border-radius: 8px; cursor: crosshair; display: none; }
    .crop-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<!-- SVG 线条图标库 -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ic-face" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="7" y="7" width="10" height="10" rx="2" ry="2"></rect></symbol>
  <symbol id="ic-camera" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></symbol>
  <symbol id="ic-image" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol>
  <symbol id="ic-settings" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></symbol>
  <symbol id="ic-list" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></symbol>
  <symbol id="ic-upload" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></symbol>
</svg>

<nav class="navbar">
  <div class="logo">
    <div class="logo-icon"><svg class="icon" width="20" height="20" stroke="currentColor"><use href="#ic-face"/></svg></div>
    <div class="logo-name">基于深度学习的人脸识别系统</div>
  </div>
  <div class="nav-right">
    <span style="font-size: 12px; color: var(--text-sub);">Powered by PyTorch & Facenet</span>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1>基于深度学习的<span class="accent">人脸识别系统</span></h1>
    <p>深度学习人脸检测与高维特征度量匹配系统</p>
  </div>

  <div class="tabs-wrap">
    <button class="tab-btn active" onclick="switchTab('dynamic', this)"><svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-camera"/></svg>动态识别 (摄像头)</button>
    <button class="tab-btn" onclick="switchTab('static', this)"><svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-image"/></svg>静态识别 (图片)</button>
    <button class="tab-btn" onclick="switchTab('manage', this)"><svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-settings"/></svg>底库管理</button>
  </div>

  <!-- 1. 动态识别面板 -->
  <div id="panel-dynamic" class="panel active">
    <div class="card">
      <div class="card-body">
        <div class="two-col-layout">
          <div class="display-container">
            <div class="display-area" id="videoArea">
              <span id="videoPlaceholder" style="color:var(--text-muted);">点击下方按钮开启摄像头</span>
              <img id="videoFeed" src="" alt="Video Feed">
            </div>
            <div style="display: flex; gap: 10px; justify-content: center;">
              <button class="btn btn-primary" id="startCamBtn" onclick="toggleAnalysisCamera(true)">开启摄像头</button>
              <button class="btn btn-ghost" id="stopCamBtn" onclick="toggleAnalysisCamera(false)" disabled>关闭摄像头</button>
            </div>
          </div>
          <div class="sidebar">
            <div class="sidebar-title"><svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-list"/></svg>实时识别记录</div>
            <div class="sidebar-list" id="dynamicLogList">
              <div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">等待摄像头开启...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 静态识别面板 -->
  <div id="panel-static" class="panel">
    <div class="card">
      <div class="card-body">
        <div class="two-col-layout">
          <div class="display-container">
            <div class="display-area" id="staticArea" style="background: var(--bg); border: 2px dashed var(--border);">
              <span id="staticPlaceholder" style="color: var(--text-muted);">在此预览图片</span>
              <img id="staticResult" src="" alt="Result">
            </div>
            <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
              <input type="file" id="staticImageInput" accept="image/*" style="display: none;" onchange="previewStaticImage(event)">
              <button class="btn btn-ghost" onclick="document.getElementById('staticImageInput').click()">选择图片</button>
              <button class="btn btn-primary" id="recognizeBtn" onclick="recognizeStatic()">开始识别</button>
              <button class="btn btn-danger" id="clearStaticBtn" onclick="clearStatic()" style="display:none;"><svg class="icon" width="14" height="14" stroke="currentColor"><use href="#ic-trash"/></svg> 清除结果</button>
            </div>
          </div>
          <div class="sidebar">
            <div class="sidebar-title"><svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-user"/></svg>画面内的人员</div>
            <div class="sidebar-list" id="staticResultList">
              <div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">请上传图片并点击开始识别</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 底库管理面板 -->
  <div id="panel-manage" class="panel">
    <div class="card">
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
        <span>人员特征库</span>
        <div style="display:flex; gap:10px;">
          <!-- 本地上传录入 -->
          <button class="btn btn-ghost" onclick="openUploadModal()">
            <svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-upload"/></svg>本地上传
          </button>
          <!-- 拍照录入 -->
          <button class="btn btn-primary" onclick="openCameraModal()">
            <svg class="icon" width="16" height="16" stroke="currentColor"><use href="#ic-camera"/></svg>拍照录入
          </button>
        </div>
      </div>
      <div class="card-body" style="padding: 0;">
        <div class="table-wrapper">
          <table>
            <thead><tr><th>序号</th><th>姓名 (Name)</th><th>状态</th><th style="text-align: right;">操作</th></tr></thead>
            <tbody id="dbTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗 1：本地图片上传录入 -->
<div class="modal-mask" id="uploadModal">
  <div class="modal-box">
    <h3 style="margin-bottom: 20px; color: var(--primary); display:flex; align-items:center; gap:8px;">
      <svg class="icon" width="20" height="20" stroke="currentColor"><use href="#ic-upload"/></svg>本地图片录入
    </h3>
    <div class="form-group">
      <label class="form-label">姓名拼音 (如 ZhangSan)</label>
      <input type="text" class="form-input" id="uploadName" placeholder="请输入姓名...">
    </div>
    <div class="form-group">
      <label class="form-label">上传清晰正脸照</label>
      <input type="file" class="form-input" id="uploadFace" accept="image/*">
    </div>
    <div style="display: flex; gap: 10px; margin-top: 24px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="submitUploadPerson()">确认录入</button>
      <button class="btn btn-ghost" style="flex: 1;" onclick="closeModals()">取消</button>
    </div>
  </div>
</div>

<!-- 弹窗 2：摄像头拍照录入与框选 -->
<div class="modal-mask" id="cameraRegModal">
  <div class="modal-box" style="width: 550px;">
    <h3 style="margin-bottom: 16px; color: var(--primary); display:flex; align-items:center; gap:8px;">
      <svg class="icon" width="20" height="20" stroke="currentColor"><use href="#ic-camera"/></svg>拍照录入与框选
    </h3>
    
    <div class="form-group">
      <label class="form-label">姓名拼音 (如 ZhangSan)</label>
      <input type="text" class="form-input" id="camName" placeholder="请输入待录入的姓名...">
    </div>

    <!-- 视频与画布区域 -->
    <div style="position: relative; width: 100%; text-align: center; background: #f9f9f9; border-radius: 8px; overflow: hidden; border: 1px solid var(--border);">
      <video id="camVideo" autoplay playsinline muted></video>
      <canvas id="camCanvas"></canvas>
    </div>
    <div class="crop-hint" id="cropHint">💡 请在画面上按住鼠标拖动，框选出人脸区域</div>

    <!-- 按钮组 -->
    <div style="display: flex; gap: 10px; margin-top: 20px;" id="camActionButtons">
      <!-- 初始状态 -->
      <button class="btn btn-primary" id="btnTakePhoto" style="flex: 1;" onclick="takePhoto()">📷 拍 照</button>
      <button class="btn btn-ghost" id="btnCancelCam" style="flex: 1;" onclick="closeModals()">取 消</button>
      
      <!-- 拍照后状态 (默认隐藏) -->
      <button class="btn btn-ghost" id="btnRetake" style="flex: 1; display:none;" onclick="retakePhoto()">🔄 重 拍</button>
      <button class="btn btn-primary" id="btnConfirmCrop" style="flex: 1; display:none;" onclick="submitCameraPerson()">✅ 确认并录入</button>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"><span id="toastMsg">操作成功</span></div>

<script>
  // ================= 基础交互 =================
  let logPollingInterval = null;

  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');

    // 只要离开动态识别页面，立刻关闭摄像头并彻底清空记录
    if (name !== 'dynamic') toggleAnalysisCamera(false);
    if (name === 'manage') loadDatabase();
  }

  function showToast(msg, isError=false) {
    const toast = document.getElementById('toast');
    toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
    document.getElementById('toastMsg').innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function closeModals() {
    document.getElementById('uploadModal').classList.remove('open');
    document.getElementById('cameraRegModal').classList.remove('open');
    document.getElementById('uploadName').value = '';
    document.getElementById('uploadFace').value = '';
    document.getElementById('camName').value = '';
    stopLocalCamera(); // 关闭硬件摄像头
  }

  // ================= 模块一：后端动态识别 =================
  function toggleAnalysisCamera(turnOn) {
    const img = document.getElementById('videoFeed');
    const placeholder = document.getElementById('videoPlaceholder');
    const startBtn = document.getElementById('startCamBtn');
    const stopBtn = document.getElementById('stopCamBtn');
    const logList = document.getElementById('dynamicLogList');

    if (turnOn) {
      fetch('/api/camera/start', { method: 'POST' }).then(() => {
        img.src = "/video_feed?" + new Date().getTime();
        img.style.display = 'block'; placeholder.style.display = 'none';
        startBtn.disabled = true; stopBtn.disabled = false;
        showToast("检测摄像头已开启");
        logList.innerHTML = '';
        logPollingInterval = setInterval(fetchCameraLogs, 1500);
      });
    } else {
      // 1. 立刻清空定时器，阻止前端继续向后端请求数据（避免出现数据回魂现象）
      if(logPollingInterval) {
        clearInterval(logPollingInterval);
        logPollingInterval = null;
      }
      
      fetch('/api/camera/stop', { method: 'POST' }).then(() => {
        img.src = ""; img.style.display = 'none'; placeholder.style.display = 'block';
        startBtn.disabled = false; stopBtn.disabled = true;
        // 2. 彻底清空列表，恢复为最初的“等待开启”状态文字
        logList.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">等待摄像头开启...</div>';
      });
    }
  }

  async function fetchCameraLogs() {
    try {
      const res = await fetch('/api/camera/logs'); const data = await res.json();
      const list = document.getElementById('dynamicLogList');
      if (data.logs.length === 0) { list.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">暂未识别到人员...</div>'; return; }
      list.innerHTML = '';
      data.logs.forEach(log => {
        const isUnknown = log.name === 'Unknown';
        const itemClass = isUnknown ? 'log-item unknown' : 'log-item';
        const displayName = isUnknown ? '陌生人' : log.name;
        list.innerHTML += `<div class="${itemClass}"><span class="name">${displayName}</span><span class="time">${log.time}</span></div>`;
      });
    } catch (e) {}
  }

  // ================= 模块二：静态识别 =================
  let staticFile = null;
  function previewStaticImage(e) {
    staticFile = e.target.files[0];
    if (staticFile) {
      document.getElementById('staticResult').src = URL.createObjectURL(staticFile);
      document.getElementById('staticResult').style.display = 'block';
      document.getElementById('staticPlaceholder').style.display = 'none';
      document.getElementById('clearStaticBtn').style.display = 'inline-flex';
      document.getElementById('staticResultList').innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">图片已就绪，请点击开始识别</div>';
    }
  }

  async function recognizeStatic() {
    if (!staticFile) return showToast("请先选择一张图片！", true);
    const btn = document.getElementById('recognizeBtn'); btn.innerText = "识别中..."; btn.disabled = true;
    const formData = new FormData(); formData.append("file", staticFile);

    try {
      const res = await fetch('/api/recognize_static', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success) {
        document.getElementById('staticResult').src = "data:image/jpeg;base64," + data.image;
        const list = document.getElementById('staticResultList');
        if(data.faces.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">未在画面中检测到人脸</div>';
        } else {
          list.innerHTML = '';
          data.faces.forEach(name => {
             const isUnknown = name === 'Unknown';
             list.innerHTML += `<div class="log-item ${isUnknown?'unknown':''}"><span class="name">${isUnknown?'未收录人员':name}</span></div>`;
          });
        }
        showToast("识别完成！");
      } else showToast(data.error, true);
    } catch (err) { showToast("请求失败", true); } finally { btn.innerText = "开始识别"; btn.disabled = false; }
  }

  function clearStatic() {
    staticFile = null; document.getElementById('staticImageInput').value = '';
    document.getElementById('staticResult').src = ''; document.getElementById('staticResult').style.display = 'none';
    document.getElementById('staticPlaceholder').style.display = 'block'; document.getElementById('clearStaticBtn').style.display = 'none';
    document.getElementById('staticResultList').innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; margin-top:20px;">请上传图片并点击开始识别</div>';
    showToast("图片及结果已清除");
  }

  // ================= 模块三：底库管理 (含拍照框选逻辑) =================
  async function loadDatabase() {
    const res = await fetch('/api/db/list'); const data = await res.json();
    const tbody = document.getElementById('dbTableBody'); tbody.innerHTML = '';
    if (data.names.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">暂无人员数据</td></tr>'; return; }
    data.names.forEach((name, idx) => {
      tbody.innerHTML += `<tr>
        <td>${idx + 1}</td><td><strong>${name}</strong></td>
        <td><span style="color:var(--success);background:var(--success-bg);padding:4px 8px;border-radius:4px;font-size:12px;">✅ 已注册</span></td>
        <td style="text-align: right;"><button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deletePerson('${name}')"><svg class="icon" width="12" height="12" stroke="currentColor"><use href="#ic-trash"/></svg> 删除</button></td>
      </tr>`;
    });
  }

  // ---- 方式 A：本地上传录入 ----
  function openUploadModal() { document.getElementById('uploadModal').classList.add('open'); }
  async function submitUploadPerson() {
    const name = document.getElementById('uploadName').value.trim();
    const file = document.getElementById('uploadFace').files[0];
    if (!name || !file) return showToast("姓名和照片为必填项！", true);
    const formData = new FormData(); formData.append("name", name); formData.append("file", file);
    sendToBackend(formData);
  }

  // ---- 方式 B：前端拍照与框选录入 ----
  let localStream = null;
  let rawImageCtx = null;
  let rawImageObj = new Image(); // 储存拍下来的纯净原图
  let cropBox = {x: 0, y: 0, w: 0, h: 0};
  let isDragging = false, startX, startY;

  function openCameraModal() {
    document.getElementById('cameraRegModal').classList.add('open');
    document.getElementById('camVideo').style.display = 'block';
    document.getElementById('camCanvas').style.display = 'none';
    document.getElementById('cropHint').style.display = 'none';
    
    // 按钮切换
    document.getElementById('btnTakePhoto').style.display = 'block';
    document.getElementById('btnCancelCam').style.display = 'block';
    document.getElementById('btnRetake').style.display = 'none';
    document.getElementById('btnConfirmCrop').style.display = 'none';

    // 新增：检查当前浏览器环境是否支持摄像头 API (拦截 IDE 内置浏览器)
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast("当前浏览器环境不支持调用摄像头，请复制网址到外部 Chrome/Edge 浏览器打开！", true);
      closeModals();
      return;
    }

    // 请求调用浏览器摄像头 (WebRTC)
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => {
        localStream = stream;
        document.getElementById('camVideo').srcObject = stream;
      })
      .catch(err => {
        showToast("无法调用摄像头，请检查浏览器权限或是否有其他程序占用！", true);
        closeModals();
      });
  }

  function stopLocalCamera() {
    if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
  }

  // 点击拍照
  function takePhoto() {
    const video = document.getElementById('camVideo');
    const canvas = document.getElementById('camCanvas');
    const ctx = canvas.getContext('2d');
    
    // 设置画布尺寸与视频真实分辨率一致
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // 绘制镜像画面（因为视频做了 css transform: scaleX(-1) 镜像，画布也要镜像画上去）
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.setTransform(1, 0, 0, 1, 0, 0); // 恢复正常坐标系
    
    // 保存一张纯净的底图，用于每次绘制裁剪框时重绘底图
    rawImageObj.src = canvas.toDataURL('image/png');
    
    // 默认框选区域（取中间的脸部大小）
    cropBox = { x: canvas.width*0.25, y: canvas.height*0.15, w: canvas.width*0.5, h: canvas.height*0.7 };

    // UI 切换
    video.style.display = 'none';
    canvas.style.display = 'block';
    document.getElementById('cropHint').style.display = 'block';
    
    document.getElementById('btnTakePhoto').style.display = 'none';
    document.getElementById('btnCancelCam').style.display = 'none';
    document.getElementById('btnRetake').style.display = 'block';
    document.getElementById('btnConfirmCrop').style.display = 'block';

    // 绘制初始框
    rawImageObj.onload = () => drawCropBox(ctx, canvas);
  }

  // 鼠标在画布上拖拽画框
  const canvas = document.getElementById('camCanvas');
  canvas.onmousedown = (e) => {
    isDragging = true;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    startX = (e.clientX - rect.left) * scaleX;
    startY = (e.clientY - rect.top) * scaleY;
  };

  canvas.onmousemove = (e) => {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const currentX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const currentY = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    cropBox = {
      x: Math.min(startX, currentX),
      y: Math.min(startY, currentY),
      w: Math.abs(currentX - startX),
      h: Math.abs(currentY - startY)
    };
    drawCropBox(canvas.getContext('2d'), canvas);
  };

  canvas.onmouseup = () => { isDragging = false; };
  canvas.onmouseleave = () => { isDragging = false; };

  // 渲染图片+半透明遮罩+蓝色选框
  function drawCropBox(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(rawImageObj, 0, 0); // 画底图
    
    // 画半透明黑色遮罩层
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 挖空框选区域 (让框内变亮)
    ctx.clearRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
    ctx.drawImage(rawImageObj, cropBox.x, cropBox.y, cropBox.w, cropBox.h, cropBox.x, cropBox.y, cropBox.w, cropBox.h);
    
    // 画蓝色边框
    ctx.strokeStyle = '#2196F3';
    ctx.lineWidth = 4;
    ctx.strokeRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
  }

  // 重拍
  function retakePhoto() {
    document.getElementById('camVideo').style.display = 'block';
    document.getElementById('camCanvas').style.display = 'none';
    document.getElementById('cropHint').style.display = 'none';
    document.getElementById('btnTakePhoto').style.display = 'block';
    document.getElementById('btnCancelCam').style.display = 'block';
    document.getElementById('btnRetake').style.display = 'none';
    document.getElementById('btnConfirmCrop').style.display = 'none';
  }

  // 确认裁剪并提交
  function submitCameraPerson() {
    const name = document.getElementById('camName').value.trim();
    if (!name) return showToast("请输入待录入的姓名拼音！", true);
    if (cropBox.w < 20 || cropBox.h < 20) return showToast("框选区域太小，请重新框选", true);

    // 创建一个新的隐藏画布，只提取框选的区域
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = cropBox.w;
    tempCanvas.height = cropBox.h;
    tempCanvas.getContext('2d').drawImage(rawImageObj, cropBox.x, cropBox.y, cropBox.w, cropBox.h, 0, 0, cropBox.w, cropBox.h);
    
    // 把截取的图像转成 Blob (文件对象)
    tempCanvas.toBlob(blob => {
      const formData = new FormData();
      formData.append("name", name);
      // 给 blob 起个虚拟文件名传给后端
      formData.append("file", blob, "camera_capture.jpg");
      sendToBackend(formData);
    }, 'image/jpeg', 0.95);
  }

  // ---- 公共上传逻辑 ----
  async function sendToBackend(formData) {
    const name = formData.get("name");
    try {
      const res = await fetch('/api/db/add', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success) {
        showToast(`人员 ${name} 录入成功！`);
        closeModals();
        loadDatabase();
      } else showToast(data.error, true);
    } catch(err) { showToast("请求失败，请检查后端运行状态", true); }
  }

  // 删除人员
  async function deletePerson(name) {
    if (!confirm(`确定要彻底删除 ${name} 的特征数据吗？`)) return;
    const res = await fetch('/api/db/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name }) });
    const data = await res.json();
    if (data.success) { showToast("删除成功！"); loadDatabase(); }
  }

  loadDatabase();
</script>
